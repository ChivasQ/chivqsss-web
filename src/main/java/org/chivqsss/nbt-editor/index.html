<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Scene</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script type="module">

        import * as THREE from 'three';

        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('canvas') 
        });

        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.position.setZ(30);

        renderer.render(scene, camera);

        const dirtTexture = new THREE.TextureLoader().load("dirt.png");
        dirtTexture.colorSpace = THREE.SRGBColorSpace;
        dirtTexture.magFilter = THREE.NearestFilter;
        dirtTexture.minFilter = THREE.NearestFilter;
        const cubeGeometry = new THREE.BoxGeometry(16, 16, 16);
        const cubeMaterial = new THREE.MeshStandardMaterial({ map: dirtTexture });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.x = 8;
        cube.position.y = 8;
        cube.position.z = 8;
        scene.add(cube);
        
        const gridHelper = new THREE.GridHelper(160,10);
        scene.add(gridHelper);

        const ambientLight = new THREE.AmbientLight(0xffffff);
        scene.add(ambientLight);
        const controls = new OrbitControls(camera, renderer.domElement);


        function render() {
            requestAnimationFrame(render);

            // cube.rotation.x += 0.01;
            // cube.rotation.y += 0.005;
            // cube.rotation.z += 0.01;

            controls.update(); 

            renderer.render(scene, camera);
        }

        render();
    </script>
</body>
</html>
