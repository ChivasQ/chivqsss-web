<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Scene</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .sidebar {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #ffffff;
            overflow-x: hidden;
            padding: 10px;
            /* padding-top: 20px; */
        }
        #drop-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 165px;
            height: 200px;
            padding: 1em;
            border: 1px solid #cccccc;
            border-radius: 4px;
            color: slategray;
            cursor: pointer;
        }

        /* #file-input {
            display: none;
        } */
        #block-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        :root {
            --bg-dark: #1a1a1a;
            --bg-panel: #252525;
            --text-color: #e0e0e0;
            --accent: #4a9eff;
            --border: #333333;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: var(--text-color);
        }

        * { box-sizing: border-box; }

        .sidebar {
            height: 100%;
            width: 300px;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: var(--bg-panel);
            overflow-y: auto;
            padding: 15px;
            border-right: 1px solid var(--border);
        }

        #block-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 20px;
        }

        .block-card {
            background-color: var(--bg-dark);
            padding: 2px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .block-card:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        #drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 120px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            color: var(--accent);
            background-color: var(--bg-dark);
        }

        button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="closable">
            <label id="drop-zone">
                <!-- Drop images here, or click to upload. -->
                <input type="file" id="file-input" accept=".nbt" />
            </label>
            <ul id="preview"></ul>
            <button id="clear-btn">Clear</button>
        </div>
        <div id="block-list"></div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="src/main.ts"></script>
</body>
</html>
